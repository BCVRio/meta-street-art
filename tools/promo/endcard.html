<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Bungee; src: url(bungee-latin.woff2) format('woff2'); }
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#050508}
.art{position:absolute;inset:-60px;background:url(keyart.webp) center/cover;animation:zoom 8s linear forwards;filter:brightness(.55) saturate(1.2)}
@keyframes zoom{from{transform:scale(1.25);filter:blur(18px) brightness(.3)}25%{filter:blur(0) brightness(.55) saturate(1.2)}to{transform:scale(1.05)}}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(5,5,8,.1),rgba(5,5,8,.85) 75%)}
.head{position:absolute;left:0;right:0;top:560px;text-align:center;color:#fff}
.eye{font:800 34px/1 -apple-system,'Helvetica Neue',Arial,sans-serif;letter-spacing:.42em;color:#3dd6ff;opacity:0;animation:fade .6s .2s forwards}
h1{font-family:Bungee;font-weight:400;font-size:140px;line-height:1;margin:40px 0 0;white-space:nowrap}
h1 span{display:inline-block;opacity:0;transform:translateY(-200px) scale(2.4) rotate(-8deg);filter:blur(12px);text-shadow:0 0 40px rgba(255,61,127,.6);animation:slam .55s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:calc(.5s + var(--i)*70ms)}
h1 span.p{color:#ff3d7f;text-shadow:0 0 50px rgba(255,61,127,.95)}
@keyframes slam{to{opacity:1;transform:none;filter:none}}
.tag{font:700 72px/1.2 -apple-system,'Helvetica Neue',Arial,sans-serif;margin-top:40px;opacity:0;transform:translateY(30px);animation:up .7s 1.5s cubic-bezier(.16,1,.3,1) forwards}
.soon{display:inline-block;margin-top:110px;font-family:Bungee;font-size:84px;letter-spacing:.06em;color:#000;background:#ff3d7f;border-radius:999px;padding:34px 80px;opacity:0;transform:scale(.6);animation:pop .6s 2.6s cubic-bezier(.2,1.6,.4,1) forwards, pulse 1.6s 3.4s infinite;box-shadow:0 0 0 0 rgba(255,61,127,.6),0 20px 80px rgba(255,61,127,.6)}
.sub{font:600 44px/1.4 -apple-system,'Helvetica Neue',Arial,sans-serif;color:#d6d6e0;margin-top:56px;opacity:0;animation:fade .8s 3.4s forwards}
@keyframes fade{to{opacity:1}} @keyframes up{to{opacity:1;transform:none}} @keyframes pop{to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,61,127,.6),0 20px 80px rgba(255,61,127,.6)}70%,100%{box-shadow:0 0 0 50px rgba(255,61,127,0),0 20px 80px rgba(255,61,127,.6)}}
.dots{position:absolute;left:0;right:0;top:1520px;height:40px}
.dots i{position:absolute;top:0;width:26px;height:26px;border-radius:50%;background:#ff3d7f;box-shadow:0 0 30px #ff3d7f;opacity:0;animation:dot 2.4s infinite;animation-delay:calc(3.6s + var(--k)*0.12s)}
@keyframes dot{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1)}70%{opacity:.25}100%{opacity:0}}
</style></head><body>
<div class="art"></div><div class="shade"></div>
<div class="head">
 <div class="eye">BCVR IMMERSIVE</div>
 <h1><span style="--i:0">S</span><span style="--i:1">P</span><span style="--i:2">R</span><span style="--i:3">A</span><span style="--i:4">Y</span><span class="p" style="--i:5">P</span><span class="p" style="--i:6">A</span><span class="p" style="--i:7">T</span><span class="p" style="--i:8">H</span></h1>
 <div class="tag">Follow the art.</div>
 <div class="soon">COMING SOON</div>
 <div class="sub">Street art in AR, worldwide<br>Walking tours · AR directions</div>
</div>
<div class="dots"></div>
<script>const d=document.querySelector('.dots');for(let k=0;k<11;k++){const i=document.createElement('i');i.style.left=(160+k*72)+'px';i.style.setProperty('--k',k);d.appendChild(i)}</script>
</body></html>
