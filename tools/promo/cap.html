<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Bungee; src: url(bungee-latin.woff2) format('woff2'); }
html,body{margin:0;width:1080px;height:1920px;background:transparent}
.bg{position:absolute;left:0;right:0;top:200px;height:700px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.5) 25%,rgba(0,0,0,.5) 60%,rgba(0,0,0,0))}
.c{position:absolute;left:70px;right:150px;top:330px;text-align:left}
.t{font-family:Bungee;font-size:96px;line-height:1.02;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px rgba(0,0,0,.6)}
.t b{font-weight:400;color:#ff3d7f;text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px rgba(255,61,127,.7)}
.s{display:inline-block;margin-top:24px;font:800 40px/1.2 -apple-system,'Helvetica Neue',Arial,sans-serif;color:#000;background:#ff3d7f;padding:12px 22px;border-radius:14px}
.cr{position:absolute;left:70px;bottom:420px;font:600 26px/1.3 -apple-system,Arial,sans-serif;color:rgba(255,255,255,.85);text-shadow:0 2px 6px #000}
</style></head><body><div class="bg"></div><div class="c"><div class="t" id="t"></div><div id="s"></div></div><div class="cr" id="cr"></div>
<script>const q=new URLSearchParams(location.search);t.innerHTML=q.get('t')||'';if(q.get('s'))s.innerHTML='<span class="s">'+q.get('s')+'</span>';cr.textContent=q.get('cr')||'';</script></body></html>
